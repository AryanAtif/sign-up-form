<!DOCTYPE html>
<html>

  <head>
    <title>Sign-up form</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>

  <body>
    <div class="main-container">
      <div class="sidebar"> </div>

      <div class="form">
        <form action="#">
          <div class="first-row">
            <div class="input-field"> 
              <label for="first-name"> First Name (*)</label>
              <input id="first-name" placeholder="Robert" required/>
            </div>
            <div class="input-field"> 
              <label for="last-name"> Last Name (*)</label>
              <input id="last-name" placeholder="House" required/>
            </div>
          </div>

          <div class="second-row">
            <div class="input-field"> 
              <label for="vault">Vault Number<sup>(1)</sup></label>
              <input id="vault" type="number" min="1" max="34"/>
            </div>
            <div class="input-field"> 
              <label for="base">Current Base (*)</label>
              <input id="base" type="email" placeholder="basename@town"required/>
            </div>
          </div>

          <div class="third-row">
            <div class="input-field"> 
              <label for="passcode">Enter Passcode</label> 
              <input id="passcode" type="password" required>
            </div>
            <div class="input-field"> 
              <label for="confirm_passcode">Confirm Passcode(*)</label> 
              <input id="confirm_passcode" type="password" required>
            </div>
          </div>

          <div class="text-box">
            <div class="input-field"> 
              <label for="info">What brings you to lucky38?</label>
              <textarea id="info" value="I'm here to...">
              </textarea>
            </div>
          </div>

          <div class="submit-btn">
            <button type="submit">Request Acess</button>
          </div>

        </form>
      </div>
    </div>

  </body>

</html>
